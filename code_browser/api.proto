// The code browser's HTTP API.  Every response body is one of these messages
// serialized as JSON (proto3 JSON mapping, field names as written here); the
// enums are the index's own, so a client that understands index.proto
// understands the API.  Byte offsets throughout, as in the index; `line` and
// `column` are 1-based conveniences computed from the file when it is present.
syntax = "proto3";

package code_browser.api;

import "cpp_formatting/index.proto";

message Error {
  int32 status = 1;
  string message = 2;
}

message IndexStats {
  uint32 files = 1;
  uint32 symbols = 2;
  uint64 occurrences = 3;
  uint32 unresolved = 4;
  uint64 db_bytes = 5;
  string imported_at = 6;  // RFC 3339 UTC
  string source_path = 7;  // the index the database was imported from
}

message RepoInfo {
  string root = 1;
  string exec_root = 2;
  string head_commit = 3;
  string head_ref = 4;
  string db_path = 5;
  string index_etag = 6;
  IndexStats stats = 7;
  TextIndexInfo text_index = 8;  // absent when full-text search is off
  CoverageInfo coverage = 9;     // absent without --coverage
}

// Line coverage (see /api/coverage), from the LCOV tracefile the server was
// started with.  Counts are uint32 so that they arrive in JSON as numbers.
message CoverageTotals {
  uint32 files = 1;
  uint32 lines_found = 2;  // instrumented lines
  uint32 lines_hit = 3;    // ... executed at least once
  uint32 branches_found = 4;
  uint32 branches_hit = 5;  // taken at least once
}

message CoverageInfo {
  string path = 1;          // the tracefile
  string collected_at = 2;  // RFC 3339 UTC: when it was written
  string etag = 3;
  CoverageTotals totals = 4;
}

// One file's coverage, as parallel arrays (a large file stays small): line
// lines[i] ran hits[i] times; branch_lines[j] has branches[j] branches, of
// which branches_taken[j] were taken.
message FileCoverage {
  string path = 1;
  repeated uint32 lines = 2;  // ascending
  repeated uint32 hits = 3;   // capped at 4294967295
  repeated uint32 branch_lines = 4;
  repeated uint32 branches = 5;
  repeated uint32 branches_taken = 6;
  CoverageTotals totals = 7;
  // The file changed after the tracefile was written: its counts may be on
  // the wrong lines.
  bool stale = 8;
}

// The full-text index (see /api/text): every text file under the root.
message TextIndexInfo {
  string path = 1;
  uint64 files = 2;         // indexed
  uint64 skipped = 3;       // binary or unreadable
  uint64 corpus_bytes = 4;
  uint64 file_bytes = 5;    // the index on disk
  string built_at = 6;      // RFC 3339 UTC
}

message TreeEntry {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  cpp_index.FileKind kind = 4;  // files only
  int32 file_id = 5;            // files only
  bool available = 6;           // files only: present in the checkout
  // With --coverage: the file's totals, or everything under the directory
  // (files the index does not list included); absent when none of it was
  // instrumented.
  CoverageTotals coverage = 7;
}

message FileList {
  string prefix = 1;
  repeated TreeEntry entries = 2;  // directories first, then files, by name
}

message Location {
  string path = 1;
  int32 file_id = 2;
  uint32 begin = 3;
  uint32 end = 4;
  uint32 line = 5;    // 1-based; 0 when the file is not available
  uint32 column = 6;  // 1-based byte column; 0 likewise
}

message SymbolSummary {
  int32 id = 1;
  string usr = 2;
  string name = 3;
  string qualified_name = 4;
  cpp_index.SymbolKind kind = 5;
  cpp_index.SymbolSubKind sub_kind = 6;
  uint32 properties = 7;
  string type = 8;
  Location definition = 9;  // the definition, else the first declaration,
                            // else the canonical location; absent if none
  cpp_index.Language language = 10;
  // What this symbol was generated from (its GENERATED_FROM relation): for
  // `set_size` of a `.pb.h`, the field `size` of the `.proto`.  That is where
  // a reader wants to go, so it rides along with every summary; it has no
  // origin of its own.
  SymbolSummary origin = 11;
  // With `origin`: the generator says this symbol modifies what it was
  // generated from -- a setter, a `mutable_` accessor (the WRITE on its
  // GENERATES anchor).  A use of it is a write of the origin.
  bool modifies_origin = 12;
}

message Span {
  uint32 begin = 1;
  uint32 end = 2;
  int32 symbol = 3;
  uint32 roles = 4;
  cpp_index.MacroContext macro = 5;
}

message Unresolved {
  uint32 begin = 1;
  uint32 end = 2;
  string name = 3;
}

message Annotations {
  string path = 1;
  int32 file_id = 2;
  repeated Span spans = 3;              // sorted by (begin, end, symbol)
  repeated SymbolSummary symbols = 4;   // every symbol the spans name
  repeated Unresolved unresolved = 5;
}

// One `#include` of a file, with the indexed files its spelling can name.
// The index records no include edges, so this is a resolution by path: the
// file next to the includer (quoted form only), the spelling as a path, then
// every indexed path that ends in it -- best candidate first.
message IncludeTarget {
  string path = 1;
  cpp_index.FileKind kind = 2;
  bool available = 3;  // present in the checkout
}

message Include {
  uint32 begin = 1;  // of the spelling, between the quotes or brackets
  uint32 end = 2;
  string spelling = 3;
  bool angled = 4;
  repeated IncludeTarget targets = 5;  // empty: no indexed file matches
}

message Includes {
  string path = 1;
  repeated Include includes = 2;  // in file order
}

message Related {
  cpp_index.RelationKind kind = 1;
  bool reverse = 2;  // false: this symbol -> related; true: related -> this
  SymbolSummary symbol = 3;
}

// Occurrences of the symbol itself.  A GENERATES anchor (index.proto) is not
// one: it marks generated text, and is counted nowhere.
message RefCounts {
  uint32 total = 1;
  uint32 definitions = 2;
  uint32 declarations = 3;
  uint32 references = 4;
  uint32 files = 5;
  // Occurrences of the symbols generated from this one (`set_size()` calls,
  // for the proto field `size`): what `/api/refs?expand=generated` adds.
  uint32 generated = 6;
}

message SymbolInfo {
  SymbolSummary symbol = 1;
  Location canonical = 2;
  repeated Location definitions = 3;
  repeated Location declarations = 4;
  repeated Related related = 5;
  RefCounts counts = 6;
}

message Reference {
  Location location = 1;
  uint32 roles = 2;
  string role_names = 3;
  cpp_index.MacroContext macro = 4;
  string line_text = 5;  // the whole line, when the file is available
  // With `expand=generated`: which symbol this is an occurrence of, when it
  // is not the one asked for (an id into References.symbols).
  int32 symbol = 6;
}

message FileReferences {
  string path = 1;
  int32 file_id = 2;
  cpp_index.FileKind kind = 3;
  repeated Reference refs = 4;
  // Test code: the file of a testonly Bazel target (a *_test rule, or a
  // library only tests may use), as the index aspect recorded it.  The files
  // of tests come after all the others, on every page.
  bool test = 5;
}

message References {
  int32 symbol = 1;
  uint32 total = 2;   // matching occurrences, before paging
  uint32 offset = 3;
  uint32 limit = 4;
  repeated FileReferences files = 5;
  bool truncated = 6;
  // With `expand=generated`: the symbols generated from `symbol`, whose
  // occurrences are listed along with its own.
  repeated SymbolSummary symbols = 7;
}

message SearchHit {
  SymbolSummary symbol = 1;
  float score = 2;
}

message SearchResults {
  string query = 1;
  repeated SearchHit hits = 2;
  bool truncated = 3;
}

message OccurrencesAt {
  string path = 1;
  uint32 offset = 2;
  repeated Span spans = 3;
  repeated SymbolSummary symbols = 4;
  repeated Unresolved unresolved = 5;
}

// /api/text: the lines of the checkout that contain `query` exactly (or
// ignoring ASCII case), by path, then line.  `text` is the line, or a part of
// it around the first match when the line is long: it starts at byte column
// `text_offset` (0-based) and is cut short when `clipped_end`.  Bytes that are
// not UTF-8 read as '?', so the spans' byte offsets into `text` hold.
message TextSpan {
  uint32 begin = 1;
  uint32 end = 2;
}

message TextLine {
  uint32 line = 1;    // 1-based
  uint32 column = 2;  // 1-based byte column of the first match
  string text = 3;
  uint32 text_offset = 4;
  bool clipped_end = 5;
  repeated TextSpan spans = 6;  // bytes into `text`
}

message TextFile {
  string path = 1;
  int32 file_id = 2;            // -1 when the symbol index lacks the file
  cpp_index.FileKind kind = 3;  // FILE_KIND_UNSPECIFIED likewise
  repeated TextLine lines = 4;
}

message TextSearchResults {
  string query = 1;
  bool case_sensitive = 2;
  uint64 total_matches = 3;
  uint64 total_lines = 4;
  uint64 files_matched = 5;
  // Too many matches to look at them all: the counts and the lines cover a
  // subset (and case-insensitively, total_matches is still exact).
  bool truncated = 6;
  uint32 offset = 7;       // in lines
  uint32 next_offset = 8;  // 0: no more
  repeated TextFile files = 9;
}
