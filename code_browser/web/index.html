<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>code browser</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="header">
  <span id="repo-name">code browser</span>
  <span id="repo-head"></span>
  <input id="search" type="search" placeholder="search symbols (/)" autocomplete="off">
  <div id="search-results" hidden></div>
</header>
<main id="main">
  <nav id="tree" aria-label="files"></nav>
  <section id="source">
    <div id="banner" hidden></div>
    <div id="file-title"></div>
    <div id="code"></div>
    <div id="panel" hidden>
      <div id="panel-bar">
        <div id="panel-tabs" role="tablist"></div>
        <button id="panel-close" title="close (Esc)">×</button>
      </div>
      <div id="panel-body"></div>
    </div>
  </section>
</main>
<footer id="status"></footer>
<script src="/app.js"></script>
</body>
</html>
