name: Release

on:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            asset: cpp_format-linux-x86_64
          - runs-on: ubuntu-24.04-arm
            asset: cpp_format-linux-aarch64
          - runs-on: macos-latest
            asset: cpp_format-darwin-aarch64
          - runs-on: windows-latest
            asset: cpp_format-windows-x86_64.exe
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: .bazel_cache
          key: bazel-repo-cache-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: |
            bazel-repo-cache-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}-
            bazel-repo-cache-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bazel Disk Cache
        uses: actions/cache@v4
        with:
          path: .disk_cache
          key: bazel-disk-cache-release-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            bazel-disk-cache-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Build binary in devcontainer
        if: runner.os == 'Linux'
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            bazel build --disk_cache=/workspace/.disk_cache --repository_cache=/workspace/.bazel_cache --config=minify //cpp_formatting:cpp_format
            cp -L bazel-bin/cpp_formatting/cpp_format ${{ matrix.asset }}

      - name: Setup Bazel
        if: runner.os != 'Linux'
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazel-version: 8.6.0

      - name: Build binary
        if: runner.os != 'Linux'
        shell: bash
        run: |
          # The minify config uses GNU-ld flags and full static linking, which
          # only work on Linux; use a plain optimized build here.
          bazel build --disk_cache=.disk_cache --repository_cache=.bazel_cache -c opt //cpp_formatting:cpp_format
          BIN=$(bazel cquery -c opt //cpp_formatting:cpp_format --output=files)
          cp "$BIN" "${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          gh release create "$TAG" cpp_format-linux-x86_64 cpp_format-linux-aarch64 \
            cpp_format-darwin-aarch64 cpp_format-windows-x86_64.exe \
            --title "$TAG" \
            --notes "Built from commit $(git rev-parse HEAD)"
