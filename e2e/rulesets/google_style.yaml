# The Google C++ Style Guide, as far as cpp_format's scopes reach: nine rename
# scopes and both rewrite passes in one run.  Every other ruleset in the corpus
# exercises one or two rules; this is the one that runs the whole tool at once,
# which is also what makes it the one that leans on the cross-rule collision
# resolution: `method` and `type` both produce UpperCamelCase names in one
# class, and the first rule in the list keeps a contested one.
#
# It is also the one that states conventions *with their exceptions*.  A broad
# scope and a fine-grained one may both match a declaration; the more specific
# rule renames it (constness, then storage, then access, then the broad scope),
# whatever the order here.
const_placement: west        # `const int x`, not `int const x`
return_types: leading        # "use trailing return types only where impractical"

normalize_variables:
  - scope: local             # locals and parameters ...
    style: snake_case
  - scope: const_local       # ... except `constexpr` and `static const` ones:
    style: kConstant         #     "fixed for the duration of the program"
  - scope: member            # "data members of classes (but not structs)
    style: trailing_         #  additionally have trailing underscores" ...
  - scope: public_member     # ... and a struct's members are the public ones
    style: snake_case
  - scope: const_member      # static const/constexpr members, whatever their access
    style: kConstant
  - scope: method            # member functions
    style: UpperCamelCase
  - scope: const_global      # constexpr/const namespace-scope constants
    style: kConstant
  - scope: type              # classes, enums, typedefs, aliases (STL protocol names exempt)
    style: UpperCamelCase
  - scope: namespace         # named namespaces and namespace aliases
    style: snake_case
